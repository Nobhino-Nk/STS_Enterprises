<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 180"
  role="img"
  aria-labelledby="logo-title logo-description"
>

  <title id="logo-title">SAZARO</title>

  <desc id="logo-description">
    SAZARO by STS Enterprises
  </desc>


  <!-- Main brand name -->

  <text
    x="300"
    y="92"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="72"
    font-weight="700"
    letter-spacing="8"
    fill="#111111"
  >
    SAZARO
  </text>


  <!-- Small brand line -->

  <text
    x="300"
    y="132"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="500"
    letter-spacing="4"
    fill="#666666"
  >
    BY STS ENTERPRISES
  </text>

</svg>
